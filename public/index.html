<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Strategy Line Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }
        .game-container { width: 95%; max-width: 450px; background: rgba(6, 16, 28, 0.95); border-radius: 40px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title { font-size: 20px; font-weight: 800; color: #BAE6FD; }
        .controls { display: flex; gap: 10px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #2c6e96; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #0f2c44; }
        .icon-btn.off { background: #440f1a; border-color: #962c3e; }
        .status-card { background: rgba(0,0,0,0.5); border-radius: 25px; padding: 15px; text-align: center; border-left: 5px solid #3b82f6; margin-bottom: 20px; min-height: 70px; display: flex; align-items: center; justify-content: center; }
        .board-frame { background: rgba(0,0,0,0.3); border-radius: 30px; padding: 10px; }
        svg { width: 100%; height: auto; }
        .line { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
        .point { fill: #0f172a; stroke: #334155; stroke-width: 2; cursor: pointer; }
        .player1 { fill: #2dc96e !important; stroke: #e2ffd6 !important; stroke-width: 3; filter: drop-shadow(0 0 8px #1e9c55); }
        .player2 { fill: #ff4d6d !important; stroke: #ffcfd9 !important; stroke-width: 3; filter: drop-shadow(0 0 7px #e63946); }
        .selected { stroke: #ffdd77 !important; stroke-width: 5; filter: drop-shadow(0 0 10px #ffbf00); }
        .move-hint { fill: rgba(59, 130, 246, 0.5); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { r: 8; } 50% { r: 12; } }
        .setup-ui { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        input { background: #0f172a; border: 1px solid #1e293b; border-radius: 15px; padding: 12px; color: white; text-align: center; outline: none; }
        .btn { padding: 15px; border-radius: 20px; border: none; font-weight: 700; cursor: pointer; background: #3b82f6; color: white; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="title">⚔️ STRATEGY LINE</div>
        <div class="controls">
            <div class="icon-btn" id="micBtn">🎤</div>
            <div class="icon-btn" id="spkBtn">🔊</div>
        </div>
    </div>
    <div class="status-card" id="statusBox">Enter Room ID to Play</div>
    <div class="board-frame">
        <svg viewBox="0 0 300 300"><g id="gridLines"></g><g id="piecesLayer"></g></svg>
    </div>
    <div class="setup-ui" id="setupUI">
        <input type="text" id="roomInput" placeholder="Room ID (e.g. 123)">
        <button class="btn" onclick="join()">JOIN ROOM</button>
    </div>
</div>

<script>
    const socket = io();
    let myRole, myRoom, peer, localStream, board = Array(9).fill(null);
    let p1P = 0, p2P = 0, phase = "placing", turn = "p1", selected = null;

    const pos = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
    const adj = {0:[1,3,4],1:[0,2,4],2:[1,5,4],3:[0,4,6],4:[0,1,2,3,5,6,7,8],5:[2,4,8],6:[3,7,4],7:[6,8,4],8:[5,7,4]};
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    // Shuruat me grid lines draw kar lo
    const grid = document.getElementById('gridLines');
    const lines = [[0,2],[6,8],[0,6],[2,8],[1,7],[3,5],[0,8],[2,6]];
    lines.forEach(l => {
        const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", pos[l[0]].x); ln.setAttribute("y1", pos[l[0]].y);
        ln.setAttribute("x2", pos[l[1]].x); ln.setAttribute("y2", pos[l[1]].y);
        ln.classList.add("line"); grid.appendChild(ln);
    });

    function join() {
        myRoom = document.getElementById('roomInput').value;
        if (myRoom) socket.emit('join-room', myRoom);
    }

    socket.on('player-assigned', (data) => {
        myRole = data.role;
        document.getElementById('setupUI').style.display = 'none';
        document.getElementById('statusBox').innerText = `Waiting for opponent...`;
        initVoice();
    });

    socket.on('start-game', () => { render(); });

    socket.on('receive-move', (data) => {
        board = data.board; phase = data.phase; turn = data.turn;
        if(data.winner) alert(data.winner === myRole ? "YOU WON! 🏆" : "YOU LOST! 💀");
        render();
    });

    function render() {
        const layer = document.getElementById('piecesLayer');
        layer.innerHTML = "";
        pos.forEach((p, i) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 15);
            c.classList.add("point");
            if(board[i] === 'p1') c.classList.add("player1");
            if(board[i] === 'p2') c.classList.add("player2");
            if(selected === i) c.classList.add("selected");
            c.onclick = () => tap(i);
            layer.appendChild(c);

            if(phase === "moving" && selected !== null && turn === myRole && adj[selected].includes(i) && !board[i]) {
                const h = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                h.setAttribute("cx", p.x); h.setAttribute("cy", p.y); h.setAttribute("r", 10);
                h.classList.add("move-hint");
                h.onclick = (e) => { e.stopPropagation(); move(i); };
                layer.appendChild(h);
            }
        });
        document.getElementById('statusBox').innerText = turn === myRole ? "🎯 YOUR TURN" : "⌛ OPPONENT TURN";
    }

    function tap(i) {
        if(turn !== myRole) return;
        if(phase === "placing" && !board[i]) {
            board[i] = myRole;
            myRole === 'p1' ? p1P++ : p2P++;
            if(p1P === 3 && p2P === 3) phase = "moving";
            finish();
        } else if(phase === "moving" && board[i] === myRole) {
            selected = (selected === i) ? null : i; render();
        }
    }

    function move(i) { board[i] = myRole; board[selected] = null; selected = null; finish(); }

    function finish() {
        let win = null;
        wins.forEach(w => { if(board[w[0]] && board[w[0]]===board[w[1]] && board[w[0]]===board[w[2]]) win = board[w[0]]; });
        turn = turn === 'p1' ? 'p2' : 'p1';
        socket.emit('move', { roomId: myRoom, board, phase, turn, winner: win });
        render();
    }

    async function initVoice() {
        peer = new Peer('peer-' + myRole + myRoom);
        try {
            localStream = await navigator.mediaDevices.getUserMedia({audio: true});
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => { const a = new Audio(); a.srcObject = s; a.play(); });
            });
            if(myRole === 'p2') {
                const call = peer.call('peer-p1' + myRoom, localStream);
                call.on('stream', s => { const a = new Audio(); a.srcObject = s; a.play(); });
            }
        } catch(e) { console.log("Mic access needed for voice chat"); }
    }

    render(); // Initial dots
</script>
</body>
</html>
