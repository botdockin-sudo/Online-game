<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Strategy Line Pro | Voice & Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --primary: #3b82f6;
            --p1: #10b981;
            --p2: #ef4444;
            --gold: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .container { width: 95%; max-width: 420px; background: var(--card); border-radius: 32px; padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; border: 1px solid rgba(255,255,255,0.05); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; margin-bottom: 25px; color: var(--primary); text-align: center; letter-spacing: 2px; }

        .hidden { display: none !important; }
        .section { animation: zoomIn 0.3s ease-out; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Menu */
        .btn { padding: 18px; border-radius: 16px; border: none; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 15px; text-transform: uppercase; }
        .btn-create { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-join { background: #1e293b; color: white; border: 1px solid var(--primary); }

        /* ID UI */
        .id-box { background: #020617; padding: 20px; border-radius: 16px; border: 2px dashed #334155; margin: 20px 0; position: relative; }
        .id-text { font-family: monospace; font-size: 14px; color: var(--primary); word-break: break-all; }
        input { width: 100%; padding: 18px; border-radius: 16px; border: 1px solid #334155; background: #020617; color: white; font-size: 16px; margin-bottom: 15px; text-align: center; outline: none; }

        /* Game UI */
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-pill { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
        
        .mic-btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: #1e293b; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .mic-btn.active { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .mic-btn.muted { background: var(--p2); }

        .board-svg { width: 100%; background: #020617; border-radius: 24px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .line { stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
        .node { fill: #0f172a; stroke: #334155; stroke-width: 2; cursor: pointer; transition: 0.3s; }
        .p1 { fill: var(--p1) !important; stroke: #fff !important; filter: drop-shadow(0 0 8px var(--p1)); }
        .p2 { fill: var(--p2) !important; stroke: #fff !important; filter: drop-shadow(0 0 8px var(--p2)); }
        .selected { stroke: var(--gold) !important; stroke-width: 5; r: 18; }
        .hint { fill: var(--primary); opacity: 0.4; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { r: 6; } 50% { r: 10; } }

        /* Result Overlay */
        #result-overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9); border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .result-title { font-family: 'Orbitron', sans-serif; font-size: 32px; margin-bottom: 10px; }
        .result-msg { font-size: 16px; opacity: 0.7; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="app-title">STRATEGY LINE</h1>

    <!-- MENU -->
    <div id="menu-screen" class="section">
        <button class="btn btn-create" onclick="showCreate()">CREATE ROOM</button>
        <button class="btn btn-join" onclick="showJoin()">JOIN ROOM</button>
    </div>

    <!-- CREATE SCREEN -->
    <div id="create-screen" class="section hidden">
        <p style="opacity: 0.6; font-size: 14px;">SHARE THIS ID WITH FRIEND</p>
        <div class="id-box">
            <div id="my-id-display" class="id-text">CONNECTING...</div>
        </div>
        <button class="btn btn-create" onclick="copyID()">COPY ID & WAIT</button>
        <button onclick="location.reload()" style="background:none; border:none; color:grey; cursor:pointer; width:100%;">Cancel</button>
    </div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="section hidden">
        <input type="text" id="input-id" placeholder="PASTE ROOM ID HERE">
        <button class="btn btn-create" onclick="joinRoom()">JOIN BATTLE</button>
        <button onclick="location.reload()" style="background:none; border:none; color:grey; cursor:pointer; width:100%;">Back</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="section hidden">
        <div class="game-header">
            <div id="status-pill" class="status-pill">WAITING...</div>
            <button class="mic-btn active" id="mic-toggle" onclick="toggleMic()">🎤</button>
        </div>
        <svg class="board-svg" viewBox="0 0 300 300" id="svg-board">
            <line class="line" x1="50" y1="50" x2="250" y2="50" /><line class="line" x1="50" y1="250" x2="250" y2="250" />
            <line class="line" x1="50" y1="50" x2="50" y2="250" /><line class="line" x1="250" y1="50" x2="250" y2="250" />
            <line class="line" x1="150" y1="50" x2="150" y2="250" /><line class="line" x1="50" y1="150" x2="250" y2="150" />
            <line class="line" x1="50" y1="50" x2="250" y2="250" /><line class="line" x1="250" y1="50" x2="50" y2="250" />
            <g id="nodes-layer"></g>
        </svg>
    </div>

    <!-- RESULT OVERLAY -->
    <div id="result-overlay" class="hidden">
        <div id="result-title" class="result-title">VICTORY!</div>
        <div id="result-msg" class="result-msg">You outsmarted your opponent.</div>
        <button class="btn btn-create" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
    const positions = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
    const adj = {0:[1,3,4],1:[0,2,4],2:[1,5,4],3:[0,4,6],4:[0,1,2,3,5,6,7,8],5:[2,4,8],6:[3,7,4],7:[6,8,4],8:[5,7,4]};
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let peer, conn, myRole, localStream, micEnabled = true;
    let state = { board: Array(9).fill(null), phase: 'placing', turn: 'p1', p1: 0, p2: 0, winner: null };
    let selectedNode = null;

    peer = new Peer();
    peer.on('open', id => document.getElementById('my-id-display').innerText = id);

    // Host Answer Call
    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
            localStream = stream;
            call.answer(stream);
            call.on('stream', rs => document.getElementById('remote-audio').srcObject = rs);
        });
    });

    peer.on('connection', c => {
        conn = c; myRole = 'p1'; setupComm();
    });

    function showCreate() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('create-screen').classList.remove('hidden');
    }

    function showJoin() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('join-screen').classList.remove('hidden');
    }

    function joinRoom() {
        const id = document.getElementById('input-id').value.trim();
        if(!id) return;
        conn = peer.connect(id);
        myRole = 'p2';
        
        // Start Voice Call to Host
        navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
            localStream = stream;
            const call = peer.call(id, stream);
            call.on('stream', rs => document.getElementById('remote-audio').srcObject = rs);
        });
        
        setupComm();
    }

    function setupComm() {
        conn.on('open', () => {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('app-title').classList.add('hidden');
            if(myRole === 'p1') sync();
            render();
        });
        conn.on('data', d => {
            state = d; render();
            if(state.winner) showFinalResult(state.winner);
        });
    }

    function tapNode(i) {
        if(state.turn !== myRole || state.winner) return;

        if(state.phase === 'placing') {
            if(!state.board[i]) {
                state.board[i] = myRole;
                myRole === 'p1' ? state.p1++ : state.p2++;
                if(state.p1 === 3 && state.p2 === 3) state.phase = 'moving';
                checkWinner();
                state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
                sync(); render();
            }
        } else {
            if(state.board[i] === myRole) {
                selectedNode = (selectedNode === i) ? null : i;
                render();
            } else if(selectedNode !== null && !state.board[i] && adj[selectedNode].includes(i)) {
                state.board[i] = myRole;
                state.board[selectedNode] = null;
                selectedNode = null;
                checkWinner();
                state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
                sync(); render();
            }
        }
    }

    function checkWinner() {
        wins.forEach(w => {
            if(state.board[w[0]] && state.board[w[0]] === state.board[w[1]] && state.board[w[0]] === state.board[w[2]]) {
                state.winner = state.board[w[0]];
            }
        });
    }

    function sync() { if(conn && conn.open) conn.send(state); }

    function render() {
        const layer = document.getElementById('nodes-layer');
        layer.innerHTML = "";
        positions.forEach((p, i) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 16);
            c.classList.add("node");
            if(state.board[i] === 'p1') c.classList.add("p1");
            if(state.board[i] === 'p2') c.classList.add("p2");
            if(selectedNode === i) c.classList.add("selected");
            c.onclick = () => tapNode(i);
            layer.appendChild(c);

            if(selectedNode !== null && !state.board[i] && adj[selectedNode].includes(i)) {
                const h = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                h.setAttribute("cx", p.x); h.setAttribute("cy", p.y); h.setAttribute("r", 8);
                h.classList.add("hint");
                h.onclick = () => tapNode(i);
                layer.appendChild(h);
            }
        });

        const pill = document.getElementById('status-pill');
        pill.innerText = (state.turn === myRole) ? "YOUR TURN" : "ENEMY TURN";
        pill.style.background = (state.turn === 'p1') ? 'var(--p1)' : 'var(--p2)';
    }

    function showFinalResult(winner) {
        const overlay = document.getElementById('result-overlay');
        const title = document.getElementById('result-title');
        const msg = document.getElementById('result-msg');
        overlay.classList.remove('hidden');
        
        if(winner === myRole) {
            title.innerText = "VICTORY!";
            title.style.color = "var(--p1)";
            msg.innerText = "Congratulations! You are the Strategy Master.";
        } else {
            title.innerText = "DEFEAT!";
            title.style.color = "var(--p2)";
            msg.innerText = "Don't give up. Try a different strategy next time!";
        }
    }

    function toggleMic() {
        micEnabled = !micEnabled;
        const btn = document.getElementById('mic-toggle');
        if(localStream) {
            localStream.getAudioTracks()[0].enabled = micEnabled;
            btn.classList.toggle('active', micEnabled);
            btn.classList.toggle('muted', !micEnabled);
            btn.innerText = micEnabled ? "🎤" : "🔇";
        }
    }

    function copyID() {
        const id = document.getElementById('my-id-display').innerText;
        navigator.clipboard.writeText(id);
        alert("ID Copied! Wait here for friend to join.");
    }
</script>
</body>
</html>
