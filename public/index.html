<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Strategy Line Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --p1: #22c55e;
            --p2: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            color: white; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .container {
            width: 90%; max-width: 400px;
            background: var(--card); border-radius: 24px;
            padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; margin-bottom: 30px; color: var(--primary); }

        /* Main Menu Buttons */
        .menu-btns { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 16px; border-radius: 12px; border: none;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-create { background: var(--primary); color: white; }
        .btn-join { background: #334155; color: white; border: 1px solid var(--primary); }

        /* Screen Sections */
        .hidden { display: none; }
        .section { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Create Room UI */
        .id-box {
            background: #0f172a; padding: 15px; border-radius: 10px;
            border: 1px dashed var(--primary); margin: 20px 0;
        }
        .id-text { font-family: monospace; font-size: 20px; color: var(--primary); word-break: break-all; }

        /* Join Room UI */
        input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #475569;
            background: #0f172a; color: white; font-size: 16px; margin-bottom: 15px; text-align: center;
        }

        /* Game Board */
        .game-status { font-weight: bold; margin-bottom: 15px; padding: 8px; border-radius: 8px; }
        .board-svg { width: 100%; background: #0f172a; border-radius: 15px; }
        .line { stroke: #334155; stroke-width: 3; }
        .node { fill: #1e293b; stroke: #475569; stroke-width: 2; cursor: pointer; }
        .p1 { fill: var(--p1) !important; stroke: #fff !important; filter: drop-shadow(0 0 5px var(--p1)); }
        .p2 { fill: var(--p2) !important; stroke: #fff !important; filter: drop-shadow(0 0 5px var(--p2)); }
        .selected { stroke: #fbbf24 !important; stroke-width: 4; r: 18; }
        .hint { fill: var(--primary); opacity: 0.5; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.1; } }

        .back-btn { margin-top: 20px; background: none; border: none; color: #94a3b8; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>STRATEGY LINE</h1>

    <!-- 1. MAIN MENU -->
    <div id="menu-screen" class="section menu-btns">
        <button class="btn btn-create" onclick="showCreateScreen()">CREATE ROOM</button>
        <button class="btn btn-join" onclick="showJoinScreen()">JOIN ROOM</button>
    </div>

    <!-- 2. CREATE SCREEN -->
    <div id="create-screen" class="section hidden">
        <p>Share this ID with your friend:</p>
        <div class="id-box">
            <div id="my-id-display" class="id-text">Generating...</div>
        </div>
        <button class="btn btn-create" onclick="copyID()">COPY ID</button>
        <p style="margin-top: 15px; font-size: 14px; color: #94a3b8;">Waiting for opponent to join...</p>
        <button class="back-btn" onclick="goBack()">Back to Menu</button>
    </div>

    <!-- 3. JOIN SCREEN -->
    <div id="join-screen" class="section hidden">
        <input type="text" id="input-id" placeholder="Paste Room ID here">
        <button class="btn btn-create" style="width: 100%" onclick="joinRoom()">JOIN NOW</button>
        <button class="back-btn" onclick="goBack()">Back to Menu</button>
    </div>

    <!-- 4. GAME SCREEN -->
    <div id="game-screen" class="section hidden">
        <div id="status-msg" class="game-status">Connected!</div>
        <svg class="board-svg" viewBox="0 0 300 300">
            <line class="line" x1="50" y1="50" x2="250" y2="50" /><line class="line" x1="50" y1="250" x2="250" y2="250" />
            <line class="line" x1="50" y1="50" x2="50" y2="250" /><line class="line" x1="250" y1="50" x2="250" y2="250" />
            <line class="line" x1="150" y1="50" x2="150" y2="250" /><line class="line" x1="50" y1="150" x2="250" y2="150" />
            <line class="line" x1="50" y1="50" x2="250" y2="250" /><line class="line" x1="250" y1="50" x2="50" y2="250" />
            <g id="board-nodes"></g>
        </svg>
        <button class="back-btn" onclick="location.reload()">Exit Game</button>
    </div>
</div>

<script>
    const positions = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
    const adj = {0:[1,3,4],1:[0,2,4],2:[1,5,4],3:[0,4,6],4:[0,1,2,3,5,6,7,8],5:[2,4,8],6:[3,7,4],7:[6,8,4],8:[5,7,4]};
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let peer, conn, myRole;
    let state = { board: Array(9).fill(null), phase: 'placing', turn: 'p1', p1P: 0, p2P: 0, active: false };
    let selected = null;

    // Initialize PeerJS
    peer = new Peer();
    peer.on('open', id => document.getElementById('my-id-display').innerText = id);

    // MENU NAVIGATION
    function showCreateScreen() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('create-screen').classList.remove('hidden');
        // Host waits for connection
        peer.on('connection', c => {
            conn = c; myRole = 'p1'; setupGame();
        });
    }

    function showJoinScreen() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('join-screen').classList.remove('hidden');
    }

    function goBack() {
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    function joinRoom() {
        const id = document.getElementById('input-id').value;
        if (!id) return alert("Please enter a Room ID");
        conn = peer.connect(id);
        myRole = 'p2';
        setupGame();
    }

    function setupGame() {
        conn.on('open', () => {
            state.active = true;
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById('game-screen').classList.remove('hidden');
            if (myRole === 'p1') sync();
            render();
        });

        conn.on('data', data => {
            state = data;
            render();
            if (state.winner) {
                setTimeout(() => alert(state.winner === myRole ? "CONGRATS! YOU WON! 🏆" : "GAME OVER! YOU LOST! 💀"), 200);
            }
        });
    }

    // GAMEPLAY LOGIC
    function tapNode(i) {
        if (!state.active || state.turn !== myRole || state.winner) return;

        if (state.phase === 'placing') {
            if (!state.board[i]) {
                state.board[i] = myRole;
                myRole === 'p1' ? state.p1P++ : state.p2P++;
                if (state.p1P === 3 && state.p2P === 3) state.phase = 'moving';
                finishTurn();
            }
        } else {
            if (state.board[i] === myRole) {
                selected = (selected === i) ? null : i;
                render();
            } else if (selected !== null && !state.board[i] && adj[selected].includes(i)) {
                state.board[i] = myRole;
                state.board[selected] = null;
                selected = null;
                finishTurn();
            }
        }
    }

    function finishTurn() {
        // Check for Winner
        wins.forEach(w => {
            if (state.board[w[0]] && state.board[w[0]] === state.board[w[1]] && state.board[w[0]] === state.board[w[2]]) {
                state.winner = state.board[w[0]];
            }
        });
        state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
        sync();
        render();
    }

    function sync() { if (conn && conn.open) conn.send(state); }

    function render() {
        const g = document.getElementById('board-nodes');
        g.innerHTML = "";
        positions.forEach((p, i) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 15);
            c.classList.add("node");
            if (state.board[i] === 'p1') c.classList.add("p1");
            if (state.board[i] === 'p2') c.classList.add("p2");
            if (selected === i) c.classList.add("selected");
            c.onclick = () => tapNode(i);
            g.appendChild(c);

            // Show move hints
            if (selected !== null && !state.board[i] && adj[selected].includes(i)) {
                const hint = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hint.setAttribute("cx", p.x); hint.setAttribute("cy", p.y); hint.setAttribute("r", 8);
                hint.classList.add("hint");
                hint.onclick = () => tapNode(i);
                g.appendChild(hint);
            }
        });

        const msg = document.getElementById('status-msg');
        if (state.winner) {
            msg.innerText = "GAME OVER";
            msg.style.background = "#475569";
        } else {
            msg.innerText = (state.turn === myRole) ? "YOUR TURN" : "OPPONENT'S TURN";
            msg.style.background = (state.turn === 'p1') ? 'var(--p1)' : 'var(--p2)';
        }
    }

    function copyID() {
        const id = document.getElementById('my-id-display').innerText;
        navigator.clipboard.writeText(id);
        alert("Room ID Copied!");
    }
</script>
</body>
</html>
