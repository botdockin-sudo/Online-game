<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Strategy Battle | Pro Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Black+Ops+One&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #020617;
            --primary: #3b82f6;
            --p1: #22c55e;
            --p2: #ef4444;
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .app-container { width: 95%; max-width: 420px; background: #0f172a; border-radius: 40px; padding: 25px; border: 2px solid #1e293b; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

        .hidden { display: none !important; }

        /* Audio Controls */
        .audio-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .ctrl-btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: #1e293b; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; }
        .ctrl-btn.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .ctrl-btn.off { background: var(--p2); }

        /* Status UI */
        .status-pill { background: #1e293b; padding: 10px; border-radius: 15px; text-align: center; font-size: 12px; font-weight: 900; margin-bottom: 15px; border: 1px solid #334155; }

        /* Menu UI */
        .btn { padding: 18px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; width: 100%; margin-bottom: 12px; text-transform: uppercase; font-size: 14px; }
        .btn-main { background: var(--primary); color: white; }
        input { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid #334155; background: #020617; color: white; text-align: center; margin-bottom: 15px; outline: none; }

        /* Board */
        .board-svg { width: 100%; background: #020617; border-radius: 25px; border: 3px solid #1e293b; padding: 10px; }
        .line { stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
        .node { fill: #0f172a; stroke: #334155; stroke-width: 2; cursor: pointer; transition: 0.3s; }
        .p1 { fill: var(--p1) !important; stroke: #fff !important; filter: drop-shadow(0 0 8px var(--p1)); }
        .p2 { fill: var(--p2) !important; stroke: #fff !important; filter: drop-shadow(0 0 8px var(--p2)); }
        .selected { stroke: var(--gold) !important; stroke-width: 5; r: 18; }
        .hint { fill: var(--primary); opacity: 0.4; }

        /* Victory/Defeat Overlay */
        #result-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 40px; text-align: center;
        }
        .result-title { font-family: 'Black Ops One', cursive; font-size: 50px; margin-bottom: 10px; letter-spacing: 3px; }
        .win-anim { color: var(--gold); animation: pulse 0.5s infinite alternate; }
        .lose-anim { color: var(--p2); animation: shake 0.2s infinite; }

        @keyframes pulse { from { transform: scale(1); text-shadow: 0 0 10px var(--gold); } to { transform: scale(1.1); text-shadow: 0 0 30px var(--gold); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

<div class="app-container">
    <h1 style="text-align:center; color:var(--primary); font-size:16px; margin-bottom:20px;">STRATEGY BATTLE</h1>

    <!-- Menu Screen -->
    <div id="menu-screen" class="section">
        <button class="btn btn-main" onclick="showCreate()">CREATE ROOM</button>
        <button class="btn" style="background:#1e293b; color:white;" onclick="showJoin()">JOIN ROOM</button>
    </div>

    <!-- Create Screen -->
    <div id="create-screen" class="section hidden">
        <p style="font-size:10px; opacity:0.5; text-align:center; margin-bottom:10px;">SHARE BATTLE ID</p>
        <div style="background:#020617; padding:15px; border-radius:10px; border:1px dashed var(--primary); text-align:center; margin-bottom:15px;">
            <span id="my-id" style="color:var(--primary); font-family:monospace; font-size:14px;">GETTING ID...</span>
        </div>
        <button class="btn btn-main" onclick="copyID()">COPY ID & WAIT</button>
        <button onclick="location.reload()" style="background:none; border:none; color:grey; width:100%; cursor:pointer;">Back</button>
    </div>

    <!-- Join Screen -->
    <div id="join-screen" class="section hidden">
        <input type="text" id="target-id" placeholder="ENTER FRIEND ID">
        <button class="btn btn-main" onclick="joinRoom()">START DUEL</button>
        <button onclick="location.reload()" style="background:none; border:none; color:grey; width:100%; cursor:pointer;">Back</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="section hidden">
        <div class="audio-bar">
            <button class="ctrl-btn active" id="mic-btn" onclick="toggleMic()">🎤</button>
            <button class="ctrl-btn active" id="spk-btn" onclick="toggleSpk()">🔊</button>
        </div>
        <div id="status-pill" class="status-pill">WAITING...</div>
        <svg class="board-svg" viewBox="0 0 300 300">
            <line class="line" x1="50" y1="50" x2="250" y2="50" /><line class="line" x1="50" y1="250" x2="250" y2="250" />
            <line class="line" x1="50" y1="50" x2="50" y2="250" /><line class="line" x1="250" y1="50" x2="250" y2="250" />
            <line class="line" x1="150" y1="50" x2="150" y2="250" /><line class="line" x1="50" y1="150" x2="250" y2="150" />
            <line class="line" x1="50" y1="50" x2="250" y2="250" /><line class="line" x1="250" y1="50" x2="50" y2="250" />
            <g id="nodes-layer"></g>
        </svg>
    </div>

    <!-- Result Overlay -->
    <div id="result-screen" class="hidden">
        <div id="result-text" class="result-title">VICTORY</div>
        <p id="result-sub" style="opacity:0.6; margin-bottom:30px;">You dominated the board!</p>
        <button class="btn btn-main" style="width:200px;" onclick="location.reload()">REMATCH</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
    const pos = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
    const adj = {0:[1,3,4],1:[0,2,4],2:[1,5,4],3:[0,4,6],4:[0,1,2,3,5,6,7,8],5:[2,4,8],6:[3,7,4],7:[6,8,4],8:[5,7,4]};
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let peer, conn, myRole, localStream;
    let state = { board: Array(9).fill(null), phase: 'placing', turn: 'p1', p1Count: 0, p2Count: 0, winner: null };
    let selected = null;

    peer = new Peer();
    peer.on('open', id => document.getElementById('my-id').innerText = id);

    // Audio Setup
    function handleCall(call) {
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
            localStream = stream;
            call.answer(stream);
            call.on('stream', rs => document.getElementById('remote-audio').srcObject = rs);
        });
    }
    peer.on('call', handleCall);

    peer.on('connection', c => { conn = c; myRole = 'p1'; setupNetwork(); });

    function showCreate() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('create-screen').classList.remove('hidden');
    }
    function showJoin() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('join-screen').classList.remove('hidden');
    }

    function joinRoom() {
        const id = document.getElementById('target-id').value.trim();
        if(!id) return;
        conn = peer.connect(id);
        myRole = 'p2';
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
            localStream = stream;
            const call = peer.call(id, stream);
            call.on('stream', rs => document.getElementById('remote-audio').srcObject = rs);
        });
        setupNetwork();
    }

    function setupNetwork() {
        conn.on('open', () => {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById('game-screen').classList.remove('hidden');
            if(myRole === 'p1') sync();
            render();
        });
        conn.on('data', d => {
            state = d;
            render();
            if(state.winner) triggerResult(state.winner);
        });
    }

    function tap(i) {
        if(state.turn !== myRole || state.winner) return;
        if(state.phase === 'placing') {
            if(!state.board[i]) {
                state.board[i] = myRole;
                myRole === 'p1' ? state.p1Count++ : state.p2Count++;
                if(state.p1Count === 3 && state.p2Count === 3) state.phase = 'moving';
                checkWin();
                state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
                sync(); render();
            }
        } else {
            if(state.board[i] === myRole) { selected = (selected === i) ? null : i; render(); }
            else if(selected !== null && !state.board[i] && adj[selected].includes(i)) {
                state.board[i] = myRole;
                state.board[selected] = null;
                selected = null;
                checkWin();
                state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
                sync(); render();
            }
        }
    }

    function checkWin() {
        wins.forEach(w => {
            if(state.board[w[0]] && state.board[w[0]] === state.board[w[1]] && state.board[w[0]] === state.board[w[2]]) {
                state.winner = state.board[w[0]];
            }
        });
    }

    function triggerResult(winner) {
        const screen = document.getElementById('result-screen');
        const text = document.getElementById('result-text');
        const sub = document.getElementById('result-sub');
        screen.classList.remove('hidden');
        
        if(winner === myRole) {
            text.innerText = "VICTORY";
            text.className = "result-title win-anim";
            sub.innerText = "You are the Strategy Master!";
            confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
        } else {
            text.innerText = "DEFEAT";
            text.className = "result-title lose-anim";
            sub.innerText = "Better luck in the next duel.";
        }
    }

    function render() {
        const layer = document.getElementById('nodes-layer');
        layer.innerHTML = "";
        pos.forEach((p, i) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 15);
            c.classList.add("node");
            if(state.board[i] === 'p1') c.classList.add("p1");
            if(state.board[i] === 'p2') c.classList.add("p2");
            if(selected === i) c.classList.add("selected");
            c.onclick = () => tap(i);
            layer.appendChild(c);
            
            if(selected !== null && !state.board[i] && adj[selected].includes(i)) {
                const h = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                h.setAttribute("cx", p.x); h.setAttribute("cy", p.y); h.setAttribute("r", 7);
                h.setAttribute("fill", "var(--primary)"); h.setAttribute("opacity", "0.4");
                h.onclick = () => tap(i);
                layer.appendChild(h);
            }
        });
        const pill = document.getElementById('status-pill');
        pill.innerText = (state.turn === myRole) ? "YOUR TURN" : "OPPONENT'S TURN";
        pill.style.color = (state.turn === 'p1') ? 'var(--p1)' : 'var(--p2)';
        if(state.winner) triggerResult(state.winner);
    }

    function toggleMic() {
        if(!localStream) return;
        const enabled = localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled;
        const btn = document.getElementById('mic-btn');
        btn.className = enabled ? "ctrl-btn active" : "ctrl-btn off";
        btn.innerText = enabled ? "🎤" : "🔇";
    }

    function toggleSpk() {
        const audio = document.getElementById('remote-audio');
        audio.muted = !audio.muted;
        const btn = document.getElementById('spk-btn');
        btn.className = !audio.muted ? "ctrl-btn active" : "ctrl-btn off";
        btn.innerText = !audio.muted ? "🔊" : "🔈";
    }

    function sync() { if(conn && conn.open) conn.send(state); }
    function copyID() {
        const id = document.getElementById('my-id').innerText;
        navigator.clipboard.writeText(id); alert("ID Copied!");
    }
</script>
</body>
</html>
