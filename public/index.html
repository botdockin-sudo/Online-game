<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Strategy Line · Pro Multiplayer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        background: radial-gradient(ellipse at 30% 20%, #0b1f33, #020617);
        display: flex; justify-content: center; align-items: center; padding: 16px; overflow: hidden;
    }
    .game-container {
        width: 100%; max-width: 480px;
        background: rgba(6, 16, 28, 0.95); backdrop-filter: blur(16px);
        border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 20px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .title { font-size: 20px; font-weight: 800; color: #BAE6FD; }
    .controls { display: flex; gap: 8px; }
    .icon-btn {
        background: #0f2c44; border: 1px solid #2c6e96; color: #c0eaff;
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn.off { background: #440f1a; border-color: #962c3e; color: #ffc0cb; }
    .status-card {
        background: rgba(0, 0, 0, 0.5); border-radius: 25px; padding: 15px;
        text-align: center; color: #f0f9ff; border-left: 5px solid #3b82f6; margin-bottom: 20px;
    }
    .board-frame { background: rgba(0, 0, 0, 0.3); border-radius: 30px; padding: 10px; }
    svg { width: 100%; height: auto; }
    .line { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .point { fill: #0f172a; stroke: #334155; stroke-width: 2; transition: 0.2s; cursor: pointer; }
    .player1 { fill: #2dc96e !important; stroke: #e2ffd6 !important; stroke-width: 3; filter: drop-shadow(0 0 8px #1e9c55); }
    .player2 { fill: #ff4d6d !important; stroke: #ffcfd9 !important; stroke-width: 3; filter: drop-shadow(0 0 7px #e63946); }
    .selected { stroke: #ffdd77 !important; stroke-width: 5; filter: drop-shadow(0 0 10px #ffbf00); }
    .move-hint { fill: rgba(59, 130, 246, 0.4); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { r: 8; } 50% { r: 12; } }
    .setup-area { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    input { background: #0f172a; border: 1px solid #1e293b; border-radius: 15px; padding: 12px; color: white; text-align: center; font-size: 14px; outline: none; }
    .btn { padding: 14px; border-radius: 20px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
    .btn-p { background: #3b82f6; color: white; }
    .btn-s { background: #1e293b; color: #cbd5e1; }
    #copyBtn { font-size: 10px; color: #3b82f6; cursor: pointer; margin-left: 5px; text-decoration: underline; }
</style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="title">⚔️ STRATEGY LINE</div>
        <div class="controls">
            <div class="icon-btn" id="micBtn">🎤</div>
            <div class="icon-btn" id="spkBtn">🔊</div>
            <div style="background: #0f2c44; padding: 6px 12px; border-radius: 20px; font-size: 10px; border: 1px solid #2c6e96;" id="phaseInd">OFFLINE</div>
        </div>
    </div>

    <div class="status-card">
        <div id="statusTxt">Share ID to start duel</div>
        <div style="font-size: 12px; margin-top: 5px; font-family: monospace; color: #3b82f6;">
            <span id="myIdDisplay">Connecting...</span>
            <span id="copyBtn" style="display:none;">COPY</span>
        </div>
    </div>

    <div class="board-frame">
        <svg viewBox="0 0 300 300">
            <line class="line" x1="50" y1="50" x2="250" y2="50" /><line class="line" x1="250" y1="50" x2="250" y2="250" />
            <line class="line" x1="250" y1="250" x2="50" y2="250" /><line class="line" x1="50" y1="250" x2="50" y2="50" />
            <line class="line" x1="150" y1="50" x2="150" y2="250" /><line class="line" x1="50" y1="150" x2="250" y2="150" />
            <line class="line" x1="50" y1="50" x2="250" y2="250" /><line class="line" x1="250" y1="50" x2="50" y2="250" />
            <g id="piecesLayer"></g>
        </svg>
    </div>

    <div class="setup-area" id="setupUI">
        <input type="text" id="roomInput" placeholder="Paste Opponent ID here">
        <button class="btn btn-s" id="joinBtn">JOIN ROOM</button>
        <button class="btn btn-p" id="createBtn">I'LL HOST (WAIT)</button>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
    const positions = [{x:50,y:50},{x:150,y:50},{x:250,y:50},{x:50,y:150},{x:150,y:150},{x:250,y:150},{x:50,y:250},{x:150,y:250},{x:250,y:250}];
    const adj = {0:[1,3,4],1:[0,2,4],2:[1,5,4],3:[0,4,6],4:[0,1,2,3,5,6,7,8],5:[2,4,8],6:[3,7,4],7:[6,8,4],8:[5,7,4]};
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let peer, conn, localStream, myRole = null;
    let board = Array(9).fill(null), p1P = 0, p2P = 0, phase = "placing", turn = "p1", selected = null, active = false;

    const layer = document.getElementById('piecesLayer');
    const statusTxt = document.getElementById('statusTxt');
    const myIdDisp = document.getElementById('myIdDisplay');
    const phaseInd = document.getElementById('phaseInd');

    // 1. PeerJS Setup
    peer = new Peer();
    peer.on('open', id => {
        myIdDisp.innerText = "YOUR ID: " + id;
        document.getElementById('copyBtn').style.display = 'inline';
        document.getElementById('copyBtn').onclick = () => { navigator.clipboard.writeText(id); alert("ID Copied!"); };
    });

    peer.on('connection', c => {
        if(conn) return; conn = c; myRole = "p1"; setupConn();
    });

    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({audio:true}).then(s => {
            call.answer(s);
            call.on('stream', rs => document.getElementById('remoteAudio').srcObject = rs);
        });
    });

    function setupConn() {
        conn.on('open', () => {
            document.getElementById('setupUI').style.display = 'none';
            active = true; phase = "placing";
            if(myRole === "p1") conn.send({type:'sync', role:'p2'});
            render();
        });
        conn.on('data', data => {
            if(data.type === 'sync') myRole = data.role;
            if(data.type === 'move') {
                board = data.board; phase = data.phase; turn = data.turn;
                p1P = data.p1P; p2P = data.p2P;
                if(data.winner) alert(data.winner === myRole ? "YOU WON! 🏆" : "YOU LOST! 💀");
                render();
            }
        });
    }

    // 2. Buttons
    document.getElementById('createBtn').onclick = () => { statusTxt.innerText = "Waiting for someone to join..."; };
    document.getElementById('joinBtn').onclick = () => {
        const id = document.getElementById('roomInput').value; if(!id) return;
        conn = peer.connect(id); myRole = "p2"; setupConn();
        navigator.mediaDevices.getUserMedia({audio:true}).then(s => {
            localStream = s; const call = peer.call(id, s);
            call.on('stream', rs => document.getElementById('remoteAudio').srcObject = rs);
        });
    };

    // 3. Game Logic
    function render() {
        layer.innerHTML = "";
        positions.forEach((p, i) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 15);
            c.classList.add("point");
            if(board[i] === 'p1') c.classList.add("player1");
            if(board[i] === 'p2') c.classList.add("player2");
            if(selected === i) c.classList.add("selected");
            c.onclick = () => tap(i);
            layer.appendChild(c);

            if(phase === "moving" && selected !== null && turn === myRole && adj[selected].includes(i) && !board[i]) {
                const h = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                h.setAttribute("cx", p.x); h.setAttribute("cy", p.y); h.setAttribute("r", 10);
                h.classList.add("move-hint");
                h.onclick = (e) => { e.stopPropagation(); move(i); };
                layer.appendChild(h);
            }
        });
        phaseInd.innerText = active ? phase.toUpperCase() : "OFFLINE";
        statusTxt.innerText = active ? (turn === myRole ? "🎯 YOUR TURN" : "⌛ OPPONENT'S TURN") : "Share ID to start duel";
    }

    function tap(i) {
        if(!active || turn !== myRole) return;
        if(phase === "placing" && !board[i]) {
            board[i] = myRole;
            myRole === 'p1' ? p1P++ : p2P++;
            if(p1P === 3 && p2P === 3) phase = "moving";
            finishTurn();
        } else if(phase === "moving" && board[i] === myRole) {
            selected = (selected === i) ? null : i;
            render();
        }
    }

    function move(i) {
        board[i] = myRole; board[selected] = null; selected = null;
        finishTurn();
    }

    function finishTurn() {
        let win = null;
        wins.forEach(w => { if(board[w[0]] && board[w[0]]===board[w[1]] && board[w[0]]===board[w[2]]) win = board[w[0]]; });
        const nextTurn = turn === 'p1' ? 'p2' : 'p1';
        conn.send({ type:'move', board, phase, turn:nextTurn, p1P, p2P, winner:win });
        turn = nextTurn;
        if(win) active = false;
        render();
    }

    // 4. Audio Controls
    let mOn = true, sOn = true;
    document.getElementById('micBtn').onclick = function() {
        mOn = !mOn; this.classList.toggle("off", !mOn);
        if(localStream) localStream.getAudioTracks()[0].enabled = mOn;
    };
    document.getElementById('spkBtn').onclick = function() {
        sOn = !sOn; this.classList.toggle("off", !sOn);
        document.getElementById('remoteAudio').muted = !sOn;
    };

    // Initial render for dots
    render();
</script>
</body>
</html>
